name: Build and Push Dist to Org Repo

on:
  push:
    branches: ['main']

# 提前开启全局 Node 24 容器支持，彻底消除插件警告
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write # 必须改为 write，允许 Actions 在本地读写代码产物

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5 # 👈 修正：官方最新实际为 v5

      - name: Set up Node.js
        uses: actions/setup-node@v5 # 👈 修正：官方最新实际为 v5
        with:
          node-version: 24 # 确保你本地用 Node 24 打包也能正常通过
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Push to pandaled-biexi-com-ffdjjk/website
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.ORG_DEPLOY_TOKEN }}
          repository-name: pandaled-biexi-com-ffdjjk/website
          branch: main
          folder: dist
          clean: true
          single-commit: true
